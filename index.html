              <path d="M-56-168c0-42 24-60 56-60s56 18 56 60c0 32-26 52-56 52s-56-20-56-52Z" fill="none" stroke="#d98a4e" stroke-opacity=".3" stroke-width="2"/>
              <g stroke="#e0894c" stroke-width="7" stroke-linecap="round" opacity=".8">
                <path d="M0-222v19"/><path d="M-19-219l6 17"/><path d="M19-219l-6 17"/>
              </g>
              <g stroke="#e0894c" stroke-width="4" stroke-linecap="round" opacity=".45">
                <path d="M-50-176l9 3"/><path d="M-52-166l9 2"/>
                <path d="M50-176l-9 3"/><path d="M52-166l-9 2"/>
              </g>
              <ellipse cx="0" cy="-148" rx="28" ry="20" fill="#fff1d9" opacity=".92"/>
              <ellipse cx="-41" cy="-146" rx="10" ry="5.5" fill="#ff9aa8" opacity=".3"/>
              <ellipse cx="41" cy="-146" rx="10" ry="5.5" fill="#ff9aa8" opacity=".3"/>

              <g class="eyes-closed" stroke="#7a4a3a" stroke-width="5" fill="none" stroke-linecap="round">
                <path d="M-38-172q11 12 22 0"/><path d="M16-172q11 12 22 0"/>
              </g>
              <g class="eyes-open">
                <ellipse cx="-27" cy="-170" rx="9.6" ry="12.2" fill="#3b2a2c"/>
                <ellipse cx="27" cy="-170" rx="9.6" ry="12.2" fill="#3b2a2c"/>
                <path d="M-27-164a8 8 0 0 0 10 4" stroke="#c98a4a" stroke-width="2" fill="none" opacity=".55"/>
                <path d="M27-164a8 8 0 0 1-10 4" stroke="#c98a4a" stroke-width="2" fill="none" opacity=".55"/>
                <circle cx="-23.6" cy="-174.4" r="3.3" fill="#fff" opacity=".95"/>
                <circle cx="30.4" cy="-174.4" r="3.3" fill="#fff" opacity=".95"/>
                <circle cx="-30" cy="-166" r="1.5" fill="#fff" opacity=".5"/>
                <circle cx="24" cy="-166" r="1.5" fill="#fff" opacity=".5"/>
              </g>

              <path d="M0-153c4 0 7 3 7 6s-3 5-7 5-7-2-7-5 3-6 7-6Z" fill="#ef8b98"/>
              <path d="M0-142v5m0 0q-6 7-13 1m13-1q6 7 13 1" stroke="#8a5646" stroke-width="3.2" fill="none" stroke-linecap="round"/>
              <g stroke="#fff4e2" stroke-width="2" stroke-linecap="round" opacity=".5" fill="none">
                <path d="M-26-152q-20-6-34-2"/><path d="M-27-146q-22 0-36 5"/><path d="M-26-140q-19 5-31 12"/>
                <path d="M26-152q20-6 34-2"/><path d="M27-146q22 0 36 5"/><path d="M26-140q19 5 31 12"/>
              </g>
              <path d="M-53-190c-4-22 16-38 44-39" fill="none" stroke="#ffe3b8" stroke-opacity=".45" stroke-width="2.6" stroke-linecap="round"/>
            </g>

            <g class="zzz" fill="none" stroke="#ffe4b5" stroke-linecap="round" stroke-linejoin="round" transform="translate(66 -236)">
              <path class="z z1" d="M0 0h13l-13 15h13" stroke-width="3"/>
              <path class="z z2" d="M18-22h9l-9 10h9" stroke-width="2.6" opacity=".8"/>
              <path class="z z3" d="M31-41h6l-6 7h6" stroke-width="2.2" opacity=".6"/>
            </g>
          </g>
        </g>

        <!-- 窗光落在地上 -->
        <path d="M756 344h396l120 176H900Z" fill="#9db8ff" opacity=".035"/>
      </svg>

      <div class="scene-dim"></div>
      <div class="scene-pill" id="scenePill"><i></i><span id="scenePillText">小猫已趴下 · 不打扰</span></div>
      <div class="bubble" id="bubble" role="status" aria-live="polite"></div>
    </section>

    <section class="timer-card" id="timerCard">
      <div class="timer-head">
        <span class="phase"><i class="phase-dot"></i><span id="phaseLabel">准备好就开始</span></span>
        <span class="round" id="roundLabel"></span>
      </div>

      <div class="timer-body">
        <div class="clock" id="clock" aria-live="off">25:00</div>
        <div class="timer-actions">
          <div class="durations" id="durations" role="group" aria-label="专注时长">
            <button type="button" data-min="15">15</button>
            <button type="button" data-min="25">25</button>
            <button type="button" data-min="40">40</button>
          </div>
          <button class="btn primary" id="startBtn" type="button">开始写作业</button>
          <button class="btn ghost" id="stopBtn" type="button" hidden>结束</button>
        </div>
      </div>

      <div class="track"><span class="track-fill" id="trackFill"></span></div>

      <div class="timer-foot">
        <p class="timer-hint" id="timerHint">点开始，小猫就趴下；时间到了它才轻轻叫你。</p>
        <div class="foot-links">
          <button class="link" id="companionBtn" type="button">今晚不计时，只让小猫陪着</button>
          <button class="link" id="closeBtn" type="button" hidden>今晚收工 · 晚安</button>
        </div>
      </div>
    </section>

    <div class="lower">
      <section class="card tasks">
        <div class="card-head">
          <h2><svg aria-hidden="true"><use href="#i-check"/></svg>今晚的作业</h2>
          <span class="count" id="taskCount">0 / 0</span>
        </div>
        <ul class="task-list" id="taskList"></ul>
        <p class="task-empty" id="taskEmpty">还没写呢。把今晚的作业告诉小猫，它会记住。</p>
        <form class="task-form" id="taskForm" autocomplete="off">
          <input id="taskInput" type="text" maxlength="40" placeholder="比如：数学卷子第 3 页" aria-label="添加一项作业">
          <button class="add-btn" type="submit" aria-label="添加">
            <svg aria-hidden="true"><use href="#i-plus"/></svg>
          </button>
        </form>
      </section>

      <section class="card stats">
        <div class="card-head">
          <h2><svg aria-hidden="true"><use href="#i-fish"/></svg>小猫的记录</h2>
        </div>
        <div class="stat-grid">
          <div class="stat">
            <span class="stat-num" id="streakNum">0</span><span class="stat-suf">天</span>
            <span class="stat-label">连续陪读</span>
          </div>
          <div class="stat">
            <span class="stat-num" id="todayNum">0</span><span class="stat-suf">条</span>
            <span class="stat-label">今晚的小鱼</span>
          </div>
          <div class="stat wide">
            <span class="stat-num" id="totalNum">0</span><span class="stat-suf">条</span>
            <span class="stat-label">一共陪小鱼写完的轮数</span>
          </div>
        </div>
        <div class="week">
          <span class="week-label">最近七晚</span>
          <div class="week-row" id="weekRow"></div>
        </div>
      </section>
    </div>

    <p class="pledge">小猫的承诺：不催你，不吵你，只在你开始和结束的时候出声。</p>
  </main>
</div>

<dialog class="settings" id="settingsDlg">
  <form id="settingsForm">
    <h2>小猫的设置</h2>
    <p class="dlg-sub">改完之后，小猫会一直记得。</p>

    <label class="field">
      <span>小鱼怎么称呼</span>
      <input id="nameFish" type="text" maxlength="6" placeholder="小鱼">
    </label>
    <label class="field">
      <span>小猫怎么称呼</span>
      <input id="nameCat" type="text" maxlength="6" placeholder="小猫">
    </label>

    <div class="field">
      <span>专注多久</span>
      <div class="seg" role="radiogroup" aria-label="专注时长">
        <label><input type="radio" name="focus" value="15"><span>15 分钟</span></label>
        <label><input type="radio" name="focus" value="25"><span>25 分钟</span></label>
        <label><input type="radio" name="focus" value="40"><span>40 分钟</span></label>
      </div>
    </div>

    <div class="field">
      <span>休息多久</span>
      <div class="seg" role="radiogroup" aria-label="休息时长">
        <label><input type="radio" name="rest" value="5"><span>5 分钟</span></label>
        <label><input type="radio" name="rest" value="10"><span>10 分钟</span></label>
      </div>
    </div>

    <label class="switch-row">
      <span>结束时轻轻响一声</span>
      <input id="soundToggle" type="checkbox">
      <i class="switch" aria-hidden="true"></i>
    </label>

    <button class="danger" id="clearData" type="button">清空所有记录</button>

    <div class="dlg-actions">
      <button class="btn ghost" id="cancelSettings" type="button">取消</button>
      <button class="btn primary" type="submit">保存</button>
    </div>
  </form>
</dialog>

<noscript><p class="noscript">小猫需要 JavaScript 才能动起来。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
